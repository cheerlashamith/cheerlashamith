    <line x1="0" y1="608" x2="1010" y2="608" stroke="#FF8C00" stroke-opacity="0.3"/>
    <text x="24" y="623" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#FFD700">main*  0 errors, 0 warnings</text>
    <text x="500" y="623" font-family="'Fira Code', monospace" font-size="10.5" fill="#9EB3D8" text-anchor="middle">UTF-8 • TypeScript • Prettier</text>
    <text x="980" y="623" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#34D399" text-anchor="end">Production Ready 🚀</text>

<svg width="1100" height="700" viewBox="0 0 1100 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Libre+Baskerville:ital,wght@0,700;1,400&amp;display=swap');
      .pulseDot { animation: pulseAnim 2s ease-in-out infinite; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.4; transform: scale(0.85); }
      }
      .cursorBlink { animation: blinkAnim 1s step-start infinite; }
      @keyframes blinkAnim {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      .glowBorder { animation: borderGlowAnim 4s ease-in-out infinite; }
      @keyframes borderGlowAnim {
        0%, 100% { stroke-opacity: 0.45; }
        50%      { stroke-opacity: 0.85; }
      }
    </style>

    <linearGradient id="termBg" x1="0" y1="0" x2="1100" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.5" stop-color="#080F28"/>
      <stop offset="1" stop-color="#0E1636"/>
    </linearGradient>

    <linearGradient id="frameBorder" x1="0" y1="0" x2="1100" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4500"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>

    <linearGradient id="activeTab" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141E3C"/>
      <stop offset="1" stop-color="#0A1024"/>
    </linearGradient>

    <linearGradient id="termDrawer" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#070D1E"/>
      <stop offset="1" stop-color="#040710"/>
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="subtleBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1100" height="700" rx="28" fill="url(#termBg)"/>

  <ellipse cx="550" cy="350" rx="350" ry="200" fill="#FF8C00" opacity="0.04" filter="url(#subtleBlur)"/>
  <ellipse cx="200" cy="180" rx="180" ry="120" fill="#FF4500" opacity="0.05" filter="url(#subtleBlur)"/>
  <ellipse cx="900" cy="520" rx="220" ry="140" fill="#FFD700" opacity="0.04" filter="url(#subtleBlur)"/>


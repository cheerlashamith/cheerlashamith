      <text y="318" fill="#E2E8F0">  },</text>
      <text y="342" fill="#E2E8F0">  flagship_build: <tspan fill="#FCD34D">"MAESTRO — YouTube Automation System"</tspan>,</text>
      <text y="366" fill="#E2E8F0">  mindset: <tspan fill="#34D399">"Build useful things. Ship with velocity."</tspan></text>

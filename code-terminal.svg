      <text y="22" fill="#E2E8F0">Active Models: <tspan fill="#FF8C00">llama3 (8B)</tspan> | <tspan fill="#FF8C00">mistral (7B)</tspan> • GPU Engine: <tspan fill="#34D399">Online (4ms)</tspan></text>

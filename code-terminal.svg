      <text y="78" fill="#F472B6">import <tspan fill="#E2E8F0">{ Engineer, AgentCluster }</tspan> <tspan fill="#F472B6">from</tspan> <tspan fill="#FCD34D">'@shamith/core'</tspan>;</text>
      

<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;family=Fira+Code:wght@500;600&amp;display=swap');
      .cursorA { animation: curA 10s infinite; }
      .cursorB { animation: curB 10s infinite; }
      @keyframes curA {
        0%, 10% { opacity: 0; }
        12%, 48% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes curB {
        0%, 50% { opacity: 0; }
        52%, 96% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
    </style>
    <linearGradient id="typeBorder" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4500" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFD700" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF4500" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="lineOne">
      <rect x="0" y="0" width="0" height="80">
        <animate attributeName="width" values="0;980;980;0;0" keyTimes="0;0.25;0.46;0.52;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="lineTwo">
      <rect x="0" y="80" width="0" height="80">
        <animate attributeName="width" values="0;0;0;980;980" keyTimes="0;0.52;0.55;0.82;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="180" rx="24" fill="#050816"/>
  <rect x="1" y="1" width="1198" height="178" rx="23" stroke="url(#typeBorder)" stroke-width="1.3"/>

  <!-- Left Icon Badge -->
  <g transform="translate(36 30)">
    <rect width="36" height="36" rx="10" fill="#0B132C" stroke="#FF8C00" stroke-opacity="0.4"/>
    <text x="18" y="24" text-anchor="middle" font-size="16">⚡</text>
  </g>

  <g transform="translate(86 32)" font-family="'Libre Baskerville', Georgia, serif" font-size="27">
    <!-- Line 1: Primary Engineering Identity -->
    <text x="0" y="36" fill="#F8FAFC" font-weight="700" clip-path="url(#lineOne)">
      Full-Stack Developer • Autonomous AI Agents • CP Builder
    </text>

    <!-- Line 2: What I craft & deliver -->
    <text x="0" y="104" fill="#FFB300" font-style="italic" clip-path="url(#lineTwo)">
      Architecting MAESTRO, Multi-Agent Systems &amp; Scalable MERN
    </text>

    <!-- Dynamic Animated Cursors -->
    <rect x="0" y="10" width="3.5" height="32" fill="#FF8C00" class="cursorA">
      <animate attributeName="x" values="0;960;960;0;0" keyTimes="0;0.25;0.46;0.52;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="78" width="3.5" height="32" fill="#FFD700" class="cursorB">
      <animate attributeName="x" values="0;0;0;940;940" keyTimes="0;0.52;0.55;0.82;1" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
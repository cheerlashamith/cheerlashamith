<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&amp;display=swap');

      /* Smooth pulse-blink with minimum opacity so cursor is always grounded and elegant */
      .typingCursor {
        animation: cursorBlinkAnim 0.8s ease-in-out infinite;
      }
      @keyframes cursorBlinkAnim {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.25; }
      }

      .borderPulse {
        animation: borderPulseAnim 4s ease-in-out infinite;
      }
      @keyframes borderPulseAnim {
        0%, 100% { stroke-opacity: 0.35; }
        50%      { stroke-opacity: 0.75; }
      }
    </style>

    <linearGradient id="typeBorder" x1="0" y1="0" x2="1200" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>

    <filter id="cursorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFD700" flood-opacity="0.85"/>
    </filter>

    <!-- Clip 1: Line 1 reveal (width: 0 -> 760px) -->
    <clipPath id="revealOne">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" 
                 values="0;0;760;760;760;760;760;0;0" 
                 keyTimes="0;0.03;0.20;0.28;0.48;0.88;0.96;0.99;1" 
                 dur="10s" 
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- Clip 2: Line 2 reveal (width: 0 -> 800px) -->
    <clipPath id="revealTwo">
      <rect x="0" y="65" width="0" height="60">
        <animate attributeName="width" 
                 values="0;0;0;0;800;800;800;0;0" 
                 keyTimes="0;0.03;0.20;0.30;0.48;0.88;0.96;0.99;1" 
                 dur="10s" 
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="170" rx="22" fill="#050816"/>
  <rect x="1" y="1" width="1198" height="168" rx="21" stroke="url(#typeBorder)" stroke-width="1.3" class="borderPulse"/>

  <!-- Left Terminal Prompt Badge -->
  <g transform="translate(40 38)">
    <rect width="44" height="94" rx="12" fill="#080F28" stroke="#FF8C00" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="22" y="38" text-anchor="middle" font-family="'Fira Code', monospace" font-size="20" font-weight="700" fill="#FF8C00">&gt;</text>
    <circle cx="22" cy="66" r="4" fill="#34D399"/>
  </g>

  <!-- Text Block & Unified Single Cursor -->
  <g transform="translate(108 36)" font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="27">
    <!-- Line 1: Strictly locked to 760px textLength -->
    <text x="0" y="36" font-weight="700" fill="#F8FAFC" textLength="760" lengthAdjust="spacing" clip-path="url(#revealOne)">Building scalable web apps • AI systems • CP builder</text>

    <!-- Line 2: Strictly locked to 800px textLength -->
    <text x="0" y="98" font-weight="600" fill="#FFB300" textLength="800" lengthAdjust="spacing" clip-path="url(#revealTwo)">Architecting MAESTRO with Ollama, agents &amp; scalable MERN</text>

    <!-- UNIFIED DEVELOPER CURSOR: Types Line 1, blinks, jumps to Line 2, types Line 2, blinks, repeats -->
    <rect class="typingCursor" width="3.5" height="32" rx="1" fill="#FFD700" filter="url(#cursorGlow)">
      <!-- Cursor X coordinate: perfectly tracks text reveals, never overshoots -->
      <animate attributeName="x" 
               values="0;0;760;760;0;800;800;800;0;0" 
               keyTimes="0;0.03;0.20;0.28;0.30;0.48;0.88;0.96;0.99;1" 
               dur="10s" 
               repeatCount="indefinite"/>
      <!-- Cursor Y coordinate: moves from Line 1 (y=10) to Line 2 (y=72) -->
      <animate attributeName="y" 
               values="10;10;10;10;72;72;72;72;10;10" 
               keyTimes="0;0.03;0.20;0.28;0.30;0.48;0.88;0.96;0.99;1" 
               dur="10s" 
               repeatCount="indefinite"/>
    </rect>
  </g>
</svg>